/* ======================================================================
   PROGRAMA DE REFORESTACIÓN · CAR WASH EXPRESS
   El programa es aritmética pública: 15 lavados son 2 árboles. La página
   se compone como un aviso bien impreso — numerales grandes, filetes de
   un pelo, un solo campo morado fuerte y aire — no como una plantilla de
   tarjetas.
   ====================================================================== */
:root{
  /* marca */
  --morado:#6C2BD9; --morado-hondo:#2E1065; --morado-vivo:#7C3AED;
  --morado-suave:rgba(108,43,217,.08); --morado-num:rgba(108,43,217,.22);
  --morado-num-alto:rgba(108,43,217,.46);
  /* El morado de relleno y el morado de leer no son el mismo trabajo: en
     oscuro, el que rellena se queda y el que se lee tiene que aclararse o no
     alcanza el contraste. Por eso van separados. */
  --morado-txt:#6C2BD9;         /* morado que se lee: rótulos, cifras chicas */
  --paso-num:#8E6FD0;           /* los numerales de los pasos: callados pero legibles */
  --morado-linea:rgba(108,43,217,.26);
  --verde:#2F7D53; --auto-vacio:rgba(23,18,37,.11); --tanda-fondo:#FBF9FE;
  /* superficies */
  --fondo:#F6F4FB; --tarjeta:#FFFFFF; --campo:#FBFAFE;
  --tinta:#171225; --gris:#514A64; --gris-claro:#6E6781;
  --linea:rgba(23,18,37,.12); --linea-fina:rgba(23,18,37,.07);
  --borde:transparent;
  --sombra:0 1px 2px rgba(23,18,37,.04), 0 8px 24px rgba(23,18,37,.05);
  --sombra-alta:0 2px 4px rgba(23,18,37,.05), 0 18px 44px rgba(23,18,37,.10);
  --realce:rgba(108,43,217,.26);        /* el filete del que está al frente */
  --rojo:#B22D22;
  --pin:#6C2BD9;      /* el disquito del número: va sobre foto, no sobre fondo */
  /* sobre el campo morado */
  --sobre-morado:#F3EEFF; --sobre-morado-tenue:rgba(243,238,255,.68);
  --morado-filete:rgba(243,238,255,.20);
  /* ---- mapa ----
     La jerarquía va por color además de por grosor, que es como se hace un
     mapa legible: el suelo construido se separa del campo abierto, la avenida
     es blanca con filo marcado, y la calle de colonia se apaga hasta quedar
     de textura. Antes todas las calles eran del mismo blanco y el fondo y las
     manzanas casi del mismo tono: se leía como un boceto. */
  --m-fondo:#EFECF7;            /* el campo, afuera de la mancha urbana */
  --m-urb:#DFD8EE;              /* el suelo construido: la ciudad se ve */
  --m-verde:#C6E2CC; --m-agua:#B6D3EA; --m-edu:#DCD3EE;
  --m-via-a:#FFFFFF; --m-casco-a:#B3A8CE;   /* carretera */
  --m-via-p:#FFFFFF; --m-casco-p:#BFB5D8;   /* avenida */
  --m-via-s:#FCFBFE; --m-casco-s:#CEC7E2;   /* secundaria */
  --m-via-t:#F9F7FD;                        /* terciaria, ya sin filo */
  --m-via-r:#F5F2FB;                        /* calle de colonia: textura */
  --m-tren:#9C93B2;
  --m-rotulo:#655E78; --m-rotulo-via:#5A5369; --m-rotulo-verde:#3F7A50;
  /* medidas */
  /* ruido finísimo: le devuelve al morado plano la textura del papel */
  --grano:url("data:image/svg+xml,<svg%20xmlns='http://www.w3.org/2000/svg'%20width='180'%20height='180'><filter%20id='g'><feTurbulence%20type='fractalNoise'%20baseFrequency='.8'%20numOctaves='3'%20stitchTiles='stitch'/><feColorMatrix%20type='saturate'%20values='0'/><feComponentTransfer><feFuncA%20type='linear'%20slope='.085'/></feComponentTransfer></filter><rect%20width='180'%20height='180'%20filter='url%28%23g%29'/></svg>");
  --canal:20px; --radio:20px; --radio-chico:14px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light dark;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --morado:#8B5CF6; --morado-hondo:#160B31; --morado-vivo:#A78BFA;
    --morado-suave:rgba(139,92,246,.13); --morado-num:rgba(139,92,246,.26);
    --morado-num-alto:rgba(139,92,246,.55);
    --morado-txt:#A78BFA; --paso-num:#675894;
    --morado-linea:rgba(139,92,246,.32);
    --verde:#5FB380; --auto-vacio:rgba(244,241,250,.15); --tanda-fondo:#171227;
    --fondo:#09070F; --tarjeta:#141020; --campo:#1A1528;
    --tinta:#F4F1FA; --gris:#B3ABC6; --gris-claro:#948CA9;
    --linea:rgba(244,241,250,.14); --linea-fina:rgba(244,241,250,.08);
    --borde:rgba(244,241,250,.10);
    --sombra:none; --sombra-alta:0 18px 44px rgba(0,0,0,.5);
    --realce:rgba(139,92,246,.42);
    --rojo:#D4574A;
    --pin:#6C2BD9;
    --sobre-morado:#EDE7FF; --sobre-morado-tenue:rgba(237,231,255,.66);
    --morado-filete:rgba(237,231,255,.16);
    /* De noche se invierte la lógica: el campo es lo más oscuro y las calles
       alumbran. Las avenidas casi brillan; las de colonia apenas se insinúan. */
    --m-fondo:#08070E; --m-urb:#141128;
    --m-verde:#15301D; --m-agua:#0F2334; --m-edu:#1A1530;
    --m-via-a:#786899; --m-casco-a:#0C0A16;
    --m-via-p:#665788; --m-casco-p:#0C0A16;
    --m-via-s:#483E63; --m-casco-s:#0C0A16;
    --m-via-t:#3A3251;
    --m-via-r:#2B2540;
    --m-tren:#4B4267;
    --m-rotulo:#9990B2; --m-rotulo-via:#ADA5C4; --m-rotulo-verde:#74A683;
  }
}
:root[data-theme="dark"]{
  --morado:#8B5CF6; --morado-hondo:#160B31; --morado-vivo:#A78BFA;
  --morado-suave:rgba(139,92,246,.13); --morado-num:rgba(139,92,246,.26);
  --morado-num-alto:rgba(139,92,246,.55);
  --morado-txt:#A78BFA; --paso-num:#675894;
  --morado-linea:rgba(139,92,246,.32);
  --verde:#5FB380; --auto-vacio:rgba(244,241,250,.15); --tanda-fondo:#171227;
  --fondo:#09070F; --tarjeta:#141020; --campo:#1A1528;
  --tinta:#F4F1FA; --gris:#B3ABC6; --gris-claro:#948CA9;
  --linea:rgba(244,241,250,.14); --linea-fina:rgba(244,241,250,.08);
  --borde:rgba(244,241,250,.10);
  --sombra:none; --sombra-alta:0 18px 44px rgba(0,0,0,.5);
  --realce:rgba(139,92,246,.42);
  --rojo:#D4574A;
  --pin:#6C2BD9;
  --sobre-morado:#EDE7FF; --sobre-morado-tenue:rgba(237,231,255,.66);
  --morado-filete:rgba(237,231,255,.16);
  /* De noche se invierte la lógica: el campo es lo más oscuro y las calles
     alumbran. Las avenidas casi brillan; las de colonia apenas se insinúan. */
  --m-fondo:#08070E; --m-urb:#141128;
  --m-verde:#15301D; --m-agua:#0F2334; --m-edu:#1A1530;
  --m-via-a:#786899; --m-casco-a:#0C0A16;
  --m-via-p:#665788; --m-casco-p:#0C0A16;
  --m-via-s:#483E63; --m-casco-s:#0C0A16;
  --m-via-t:#3A3251;
  --m-via-r:#2B2540;
  --m-tren:#4B4267;
  --m-rotulo:#9990B2; --m-rotulo-via:#ADA5C4; --m-rotulo-verde:#74A683;
}
*,*::before,*::after{box-sizing:inherit}
html{-webkit-text-size-adjust:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--fondo);color:var(--tinta);
  font-family:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;
  overflow-x:hidden}
img{max-width:100%;display:block}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
a{color:var(--morado-txt)}
h1,h2,h3{text-wrap:balance}
/* Que ningún párrafo termine con una palabra sola en su renglón; donde el
   navegador no lo sabe hacer, no pasa nada. Lo corto —la línea bajo el
   título, los pasos, las opciones de voto— va parejo en vez de eso. */
p{text-wrap:pretty}
.titulo-nota,.cartel-nota,.opcion-txt,.franja p,.foto-card .rotulo p,.tj .corrido,
.tj-guia .guia{text-wrap:balance}
.meta .fecha{white-space:nowrap}

/* ---------- estructura ---------- */
.barra{height:3px;background:var(--morado)}
.envoltura{max-width:960px;margin:0 auto;padding:0 var(--canal)}
section{padding:44px 0 0}
@media(min-width:720px){section{padding:64px 0 0}}

.etq{font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--morado-txt);
  font-weight:500;margin:0}
.etq.gris{color:var(--gris-claro)}
.cab{display:flex;justify-content:space-between;align-items:baseline;gap:16px;
  margin:0 0 18px;padding-bottom:12px;border-bottom:1px solid var(--linea-fina)}
.cab .lado{font-size:12.5px;color:var(--gris-claro);flex:none}
.cab-izq{display:flex;align-items:center;gap:9px;min-width:0}
/* la marca del programa: 15 ranuras, 2 llenas */
.sello{display:block;flex:none;width:16px;height:16px;overflow:visible;
  fill:none;stroke:var(--morado-num-alto);stroke-width:12;stroke-linecap:round}
.sello .on{stroke:var(--morado)}
.caja{background:var(--tarjeta);border-radius:var(--radio);box-shadow:var(--sombra);
  border:1px solid var(--borde)}
.pista{font-size:13px;line-height:1.5;color:var(--gris-claro);margin:12px 0 0}

/* ---------- el campo morado: portada y cierre, sobre foto ---------- */
.campo-morado{position:relative;overflow:hidden;color:var(--sobre-morado);
  background-color:var(--morado-hondo);isolation:isolate}
.campo-morado .foto-fondo{position:absolute;left:0;right:0;top:-58px;bottom:-58px;
  background-size:cover;background-position:center 38%;z-index:-2;
  filter:saturate(1.14) brightness(1.07);
  transform:translate3d(0,var(--par,0px),0)}
/* La foto del bosque es vertical. En pantalla ancha la franja es apaisada, así
   que la foto tendría que estirarse tres veces para taparla y se vería
   reventada. En vez de eso se deja a propósito fuera de foco: el bosque se
   sigue leyendo, el morado manda, y no hay un solo píxel estirado a la vista. */
@media(min-width:860px){
  .campo-morado .foto-fondo{filter:saturate(1.14) brightness(1.07) blur(3px);
    transform:translate3d(0,var(--par,0px),0) scale(1.05)}
}
@media (prefers-reduced-motion: reduce){
  .campo-morado .foto-fondo{transform:none}
}
/* El velo oscurece donde va el texto y deja respirar la foto en medio. */
.campo-morado .velo-morado{position:absolute;inset:0;z-index:-1;
  background:
    var(--grano),
    linear-gradient(to bottom, rgba(20,8,48,.88) 0%, rgba(22,9,52,.52) 30%,
      rgba(24,10,56,.12) 52%, rgba(20,8,48,.62) 88%, rgba(18,7,44,.76) 100%),
    linear-gradient(to right, rgba(20,8,48,.62) 0%, rgba(20,8,48,.12) 62%,
      rgba(52,18,120,.22) 100%)}
:root[data-theme="dark"] .campo-morado .velo-morado,
:root:not([data-theme="light"]) .campo-morado .velo-morado{
  background:
    var(--grano),
    linear-gradient(to bottom, rgba(6,3,16,.92) 0%, rgba(10,4,26,.66) 30%,
      rgba(12,5,30,.40) 52%, rgba(8,3,20,.80) 88%, rgba(6,3,16,.90) 100%),
    linear-gradient(to right, rgba(6,3,16,.70) 0%, rgba(8,4,22,.22) 62%,
      rgba(40,14,96,.30) 100%)}
.campo-morado .etq{color:var(--sobre-morado-tenue)}

/* tarjeta que flota sobre la foto, como en las referencias */
.flotante{display:none}
@media(min-width:900px){
  .flotante{display:flex;gap:13px;position:absolute;right:38px;top:108px;width:286px;
    background:rgba(255,255,255,.13);border:1px solid var(--morado-filete);
    border-radius:20px;padding:13px;z-index:3;
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    box-shadow:0 12px 34px rgba(8,4,22,.28)}
}
.flotante .mini-foto{width:58px;height:58px;border-radius:14px;flex:none;
  background-size:cover;background-position:center}
.flotante b{display:block;font-size:13.5px;color:#fff;font-weight:500;line-height:1.25}
.flotante span{display:block;margin-top:4px;font-size:11.5px;line-height:1.38;
  color:var(--sobre-morado-tenue)}

/* cifras de un vistazo, sobre la foto */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin:32px 0 0}
@media(min-width:660px){.tiles{grid-template-columns:repeat(4,1fr);gap:11px}}
.tile{background:rgba(255,255,255,.11);border:1px solid var(--morado-filete);
  border-radius:16px;padding:15px 14px;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.tile b{display:block;font-family:"Playfair Display",serif;font-weight:500;
  font-size:27px;line-height:1;color:#fff;font-variant-numeric:tabular-nums}
.tile span{display:block;margin-top:8px;font-size:9.5px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--sobre-morado-tenue);line-height:1.35}

/* ---------- portada ---------- */
.portada{padding:22px 0 0;margin:10px 10px 0;border-radius:26px}
@media(min-width:720px){.portada{margin:14px 14px 0;border-radius:32px;padding:26px 0 0}}
.tapa{display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding-bottom:30px}
.marca{display:flex;align-items:center;gap:11px;min-width:0}
.disco{width:42px;height:42px;flex:none;border-radius:50%;background:rgba(255,255,255,.12);
  display:grid;place-items:center;overflow:hidden;
  border:1px solid rgba(255,255,255,.18)}
.disco img{width:100%;height:100%;object-fit:contain}
.disco span{font-family:"Playfair Display",serif;color:#fff;font-size:15px}
.marca-txt{font-size:10px;letter-spacing:.24em;text-transform:uppercase;
  color:var(--sobre-morado-tenue);line-height:1.4}
.tema{flex:none;border:1px solid var(--morado-filete);border-radius:999px;
  padding:8px 14px;font-size:9px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--sobre-morado-tenue)}
.tema:hover{color:var(--sobre-morado);border-color:rgba(243,238,255,.42)}

h1{font-family:"Playfair Display",serif;font-weight:600;letter-spacing:-.022em;
  font-size:clamp(38px,10.4vw,74px);line-height:.98;margin:0;
  max-width:14ch}
h1 em{display:block;font-style:italic;font-weight:500;color:#C4B5FD}
:root[data-theme="dark"] h1 em,:root:not([data-theme="light"]) h1 em{color:#C4B5FD}
/* la condición de la promesa: pegada al título y legible, no letra chica de
   contrato. Se lee de corrido con él. */
.titulo-nota{margin:14px 0 0;max-width:30ch;font-size:15.5px;line-height:1.45;
  color:var(--sobre-morado-tenue)}
.pildora{display:inline-block;margin:26px 0 0;background:rgba(255,255,255,.13);
  border:1px solid var(--morado-filete);color:var(--sobre-morado);
  border-radius:999px;padding:9px 18px;font-size:13px}
.lema{color:var(--sobre-morado-tenue);font-size:12.5px;margin:14px 0 0;
  letter-spacing:.04em}
.portada-pie{height:66px}

/* ---------- marcador: se monta sobre el campo morado ---------- */
.marcador{margin:-46px 0 0;padding:30px 26px 26px;text-align:center;
  box-shadow:var(--sombra-alta);position:relative;z-index:2}
.marcador .n{font-family:"Playfair Display",serif;font-weight:500;
  font-size:clamp(58px,17vw,92px);line-height:.9;color:var(--morado);
  font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.marcador .t{font-size:10px;letter-spacing:.24em;text-transform:uppercase;
  color:var(--gris);margin-top:12px}

.marcador .sub{font-size:13.5px;color:var(--gris);margin:13px 0 0;
  max-width:42ch;margin-inline:auto}


/* ---------- la mecánica dibujada ---------- */



/* ---------- la tanda en curso ---------- */
.tanda{margin:26px 0 0;padding:20px 20px 22px;border-radius:var(--radio);
  background:var(--tanda-fondo);border:1px solid var(--morado-linea);
  box-shadow:var(--sombra)}
.tanda-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.faltan{text-align:right;line-height:1}
.faltan span{display:block;font-size:10px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--gris-claro)}
.faltan b{display:block;margin-top:4px;font-family:"Playfair Display",serif;
  font-weight:500;font-size:34px;color:var(--morado);font-variant-numeric:tabular-nums}
.tanda-cuerpo{display:flex;align-items:center;gap:16px;margin-top:14px}
@media(min-width:520px){.tanda-cuerpo{gap:28px;margin-top:18px}}

.anillo{position:relative;width:min(48%,176px);flex:none;aspect-ratio:1}
.anillo svg{width:100%;height:100%;display:block;overflow:visible}
.seg{fill:none;stroke-width:15;stroke-linecap:butt}
.seg.vacio{stroke:var(--auto-vacio)}
.seg.on{stroke:var(--morado);animation:dibujaSeg .5s ease forwards}
@keyframes dibujaSeg{to{stroke-dashoffset:0}}
.anillo-centro{position:absolute;inset:0;display:grid;place-content:center;
  text-align:center;pointer-events:none}
.anillo-centro b{display:block;font-family:"Playfair Display",serif;font-weight:500;
  font-size:clamp(34px,11vw,46px);line-height:.9;color:var(--morado);
  font-variant-numeric:tabular-nums}
.anillo-centro span{display:block;margin-top:6px;font-size:9.5px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--gris-claro)}

.premio{flex:1;display:grid;place-items:end center;min-width:0}
.premio-arbol{position:relative;width:100%;max-width:150px;height:130px}
@media(min-width:520px){.premio-arbol{max-width:190px;height:164px}}
.premio-arbol .capa{position:absolute;inset:0;background-repeat:no-repeat;
  background-position:center bottom;background-size:contain;
  opacity:0;transform:translateY(7px) scale(.97);transform-origin:center bottom;
  transition:opacity .75s ease, transform .75s cubic-bezier(.22,.8,.3,1)}
.premio-arbol .capa.ver{opacity:1;transform:none}
/* con "reducir movimiento": cambia igual, pero de golpe */
.premio-arbol.seco .capa{transition:none;transform:none}
.tanda-pie{display:flex;align-items:baseline;justify-content:center;gap:9px;
  margin-top:16px;padding-top:14px;border-top:1px solid var(--linea-fina);
  flex-wrap:wrap}
.tanda-pie b{font-family:"Playfair Display",serif;font-weight:500;font-size:21px;
  color:var(--tinta);line-height:1}
.tanda-pie span{font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--gris-claro)}
@media (prefers-reduced-motion: reduce){
  .seg.on{animation:none;stroke-dasharray:none!important;stroke-dashoffset:0!important}
  .premio-arbol .capa{transition:none;transform:none}
}

/* ---------- navegación ---------- */
.navbar{position:fixed;top:0;left:0;right:0;z-index:30;
  padding-top:env(safe-area-inset-top,0px);
  background:rgba(255,255,255,.86);border-bottom:1px solid var(--linea-fina);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  transform:translateY(-102%);transition:transform .35s cubic-bezier(.22,.8,.3,1)}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .navbar{background:rgba(12,9,20,.88)}
}
:root[data-theme="dark"] .navbar{background:rgba(12,9,20,.88)}
.navbar.ver{transform:none}
.nav-in{display:flex;align-items:center;justify-content:space-between;gap:16px;
  height:56px}
.nav-marca{display:flex;align-items:center;gap:9px;text-decoration:none;
  color:var(--tinta);font-size:10px;letter-spacing:.2em;text-transform:uppercase;
  flex:none}
.nav-disco{width:28px;height:28px;border-radius:50%;background:var(--morado);
  display:grid;place-items:center;overflow:hidden;flex:none}
.nav-disco img{width:100%;height:100%;object-fit:contain}
.nav-disco b{color:#fff;font-family:"Playfair Display",serif;font-size:11px}
.nav-ligas{display:flex;gap:16px;overflow-x:auto;scrollbar-width:none}
.nav-ligas::-webkit-scrollbar{display:none}
.nav-ligas a{color:var(--gris);text-decoration:none;font-size:12.5px;white-space:nowrap;
  padding:6px 0;border-bottom:2px solid transparent}
.nav-ligas a:hover{color:var(--morado);border-bottom-color:var(--morado-linea)}
@media(max-width:420px){.nav-marca span:not(.nav-disco){display:none}
  .nav-ligas{gap:14px}.nav-ligas a{font-size:12px}}
section{scroll-margin-top:76px}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}
  .navbar{transition:none}}

/* si el navegador no difumina, el fondo se hace sólido para que se lea */
@supports not ((backdrop-filter:blur(2px)) or (-webkit-backdrop-filter:blur(2px))){
  .tile{background:rgba(26,10,56,.62)}
  .flotante{background:rgba(26,10,56,.74)}
  .navbar{background:var(--fondo)}
}

/* ---------- pasos: lista con filete, no seis tarjetas ---------- */
.pasos{display:grid;gap:0}
@media(min-width:720px){
  .pasos{grid-template-columns:1fr 1fr;column-gap:40px}
  .tj-guia,.tj-cierra{grid-column:1/-1}
}
.tj{display:grid;grid-template-columns:auto 1fr;gap:0 16px;align-items:start;
  padding:13px 0;border-bottom:1px solid var(--linea-fina)}
.tj:last-child{border-bottom:0}
.tj .num{grid-row:span 2;font-family:"Playfair Display",serif;font-size:26px;
  line-height:1.1;color:var(--paso-num);font-variant-numeric:tabular-nums;
  width:42px}   /* fijo: así los seis textos arrancan del mismo filo */
.tj p{margin:0;font-size:15px;line-height:1.5;color:var(--gris);grid-column:2}
/* los cinco de corrido: el rótulo entra en la misma línea, como en un glosario */
.tj .corrido .rot{font-weight:500;color:var(--tinta)}
.tj .corrido .rot::after{content:" · ";color:var(--morado-num-alto);font-weight:400}
/* el primero es el trato completo, así que se lee antes que los demás */
.tj-guia{padding:6px 0 20px}
.tj-guia .num{font-size:34px}
.tj-guia .etq{align-self:center;font-size:9.5px;letter-spacing:.2em}
.tj-guia .guia{margin:7px 0 0;font-family:"Playfair Display",serif;font-weight:500;
  font-size:clamp(22px,5.6vw,29px);line-height:1.16;letter-spacing:-.015em;
  color:var(--tinta);max-width:26ch;text-wrap:balance}
.franja{margin:26px 0 0;padding:22px 22px;border-radius:var(--radio-chico);
  background:var(--morado-suave);border:1px solid var(--morado-linea)}
.franja .etq{color:var(--morado-txt)}
.franja p{margin:9px 0 0;font-size:14.5px;color:var(--tinta)}

/* ---------- mapa ---------- */
.mapa-caja{position:relative;border-radius:var(--radio);background:var(--m-fondo);
  overflow:hidden;box-shadow:var(--sombra);border:1px solid var(--borde)}
.mapa-lienzo{position:absolute;inset:0;width:100%;height:100%;display:block}
.mapa-caja svg{position:relative;z-index:1;display:block;width:100%;height:auto;
  background:transparent;touch-action:pan-y}
.mapa-caja.zoom svg{touch-action:pan-y;cursor:grab}
.mapa-caja.zoom svg:active{cursor:grabbing}
.mapa-caja.pinza svg,.mapa-caja.zoom.pinza svg{touch-action:none}
.mapa-caja.eligiendo svg{cursor:crosshair}
.mapa-ctrl{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;
  gap:7px;z-index:2}
.mapa-ctrl button{width:38px;height:38px;border:1px solid var(--linea);
  background:var(--tarjeta);color:var(--tinta);font-size:16px;line-height:1;
  display:grid;place-items:center;border-radius:12px;box-shadow:var(--sombra)}
.mapa-ctrl button:active{background:var(--morado);color:#fff;border-color:var(--morado)}
.mapa-top{position:absolute;left:12px;top:12px;display:flex;gap:6px;
  pointer-events:none;z-index:2}
.mapa-eti{background:var(--tarjeta);border:1px solid var(--linea);border-radius:999px;
  padding:7px 13px;font-size:9px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--gris);box-shadow:var(--sombra)}
.mapa-nota{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:2;
  background:var(--tarjeta);border:1px solid var(--linea);border-radius:999px;
  padding:11px 20px;font-size:12.5px;color:var(--gris);pointer-events:none;
  box-shadow:var(--sombra);text-align:center;max-width:86%}
.mapa-credito{position:absolute;left:12px;bottom:10px;margin:0;z-index:2;
  font-size:8.5px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--m-rotulo);pointer-events:none;opacity:.85}
.globo{position:absolute;z-index:3;background:var(--tarjeta);color:var(--tinta);
  border:1px solid var(--linea);box-shadow:var(--sombra-alta);
  font-size:12px;line-height:1.35;padding:8px 12px;border-radius:11px;
  pointer-events:none;white-space:nowrap;opacity:0;transition:opacity .12s;
  transform:translate(-50%,-100%)}
.globo.ver{opacity:1}
.globo b{font-weight:500}
.globo i{display:block;font-style:normal;color:var(--gris);font-size:11px}
.pin{cursor:pointer}
.pin:focus{outline:none}
.pin:focus-visible .pin-halo{stroke:var(--morado);stroke-width:2.5}
.pin-cuerpo{fill:var(--morado)}
.pin-halo{fill:var(--tarjeta);opacity:.96}
.pin-num{fill:#fff;font-family:"DM Sans",sans-serif;font-size:10.5px;
  font-weight:500;pointer-events:none;user-select:none}
.pin-pulso{fill:var(--morado);opacity:0;transform-box:fill-box;transform-origin:center}
.pin.sel .pin-pulso{animation:pulso 1.7s ease-out 3}
@keyframes pulso{0%{opacity:.45;transform:scale(1)}100%{opacity:0;transform:scale(3.6)}}
.marca-halo{fill:var(--tarjeta);opacity:.96}
.marca-cuerpo{fill:var(--morado)}
.marca-cruz{stroke:#fff;stroke-width:2;stroke-linecap:round}

/* ---------- filtros ---------- */
.filtros-caja{position:relative;margin:0 0 16px}
.filtros-caja::before,.filtros-caja::after{content:"";position:absolute;top:0;bottom:0;
  width:38px;pointer-events:none;opacity:0;transition:opacity .25s;z-index:1}
.filtros-caja::before{left:0;background:linear-gradient(90deg,var(--fondo) 22%,transparent)}
.filtros-caja::after{right:0;background:linear-gradient(270deg,var(--fondo) 22%,transparent)}
.filtros-caja.hay-izq::before,.filtros-caja.hay-der::after{opacity:1}
.filtros{display:flex;flex-wrap:nowrap;gap:8px;margin:0;padding:1px 0;
  overflow-x:auto;overflow-y:hidden;scrollbar-width:none;-ms-overflow-style:none;
  -webkit-overflow-scrolling:touch;scroll-snap-type:x proximity}
.filtros::-webkit-scrollbar{display:none}
.chip{flex:none;white-space:nowrap;scroll-snap-align:start;
  background:var(--tarjeta);border:1px solid var(--linea);border-radius:999px;
  padding:9px 15px;font-size:12px;color:var(--gris);line-height:1;
  transition:background .2s,color .2s,border-color .2s}
.chip.on{background:var(--morado);border-color:var(--morado);color:#fff}
/* En oscuro, blanco sobre el morado de relleno se queda corto: se invierte
   —relleno claro, tinta oscura—, que es como se hace una pastilla marcada en
   una interfaz de noche. */
:root[data-theme="dark"] .chip.on,:root:not([data-theme="light"]) .chip.on{
  background:var(--morado-vivo);border-color:var(--morado-vivo);color:#140B2B}

/* ---------- carrusel de árboles ---------- */
.carrusel-caja{position:relative}
.carrusel{--ancho:82%;display:flex;gap:14px;overflow-x:auto;overflow-y:hidden;
  scroll-snap-type:x mandatory;scrollbar-width:none;-ms-overflow-style:none;
  padding:12px 0 16px;margin:0 -4px;outline:none}
@media(min-width:620px){.carrusel{--ancho:min(52%,400px)}}
@media(min-width:980px){.carrusel{--ancho:min(37%,380px)}}
/* los dos huecos de las orillas: dejan que el primero y el último
   también puedan quedar al centro de la pantalla */
.carrusel::before,.carrusel::after{content:'';flex:none;
  inline-size:max(0px,(100% - var(--ancho))/2 - 14px)}
.carrusel::-webkit-scrollbar{display:none}
.carrusel:focus-visible{outline:2px solid var(--morado);outline-offset:4px;border-radius:22px}
.arbol{background:var(--tarjeta);border-radius:var(--radio);box-shadow:var(--sombra);
  padding:14px;text-align:left;border:1px solid var(--borde);width:100%;display:block}
.carrusel .arbol{flex:0 0 var(--ancho);scroll-snap-align:center;
  transition:transform .45s cubic-bezier(.22,.8,.3,1),opacity .45s ease,
    box-shadow .45s ease,border-color .45s ease}
.carrusel .arbol:not(.act){transform:scale(.88);opacity:.38}
.carrusel .arbol.act{transform:scale(1.02);
  box-shadow:0 0 0 1.5px var(--realce), var(--sombra-alta)}
.arbol .foto{position:relative;aspect-ratio:4/3;background:var(--morado-suave);
  border-radius:var(--radio-chico);overflow:hidden;display:grid;place-items:center;
  margin-bottom:14px}
.arbol .foto img{width:100%;height:100%;object-fit:cover}
.arbol .foto .sin-foto{font-size:9px;letter-spacing:.18em;color:var(--gris-claro);
  text-transform:uppercase}
.arbol h3{font-family:"Playfair Display",serif;font-weight:500;font-size:23px;
  margin:0;line-height:1.12;letter-spacing:-.01em}
.arbol .meta{font-size:13px;color:var(--gris);margin-top:6px;line-height:1.45}
.n-pin{position:absolute;left:10px;top:10px;width:26px;height:26px;border-radius:50%;
  background:var(--pin);color:#fff;font-size:12px;display:grid;place-items:center;
  box-shadow:0 2px 8px rgba(23,18,37,.3);font-weight:500;
  font-variant-numeric:tabular-nums}
.tag-ej{position:absolute;right:9px;top:9px;background:rgba(255,255,255,.9);
  color:#5F586F;border:1px solid rgba(23,18,37,.08);border-radius:999px;
  padding:4px 9px;font-size:8px;letter-spacing:.14em;text-transform:uppercase}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .tag-ej{background:rgba(20,16,32,.86);color:var(--gris)}
}
:root[data-theme="dark"] .tag-ej{background:rgba(20,16,32,.86);color:var(--gris)}
.padrino{display:inline-block;margin-top:11px;font-size:9.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--morado);background:var(--morado-suave);
  border-radius:999px;padding:5px 11px;max-width:100%;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;vertical-align:bottom}
.carrusel-pie{display:flex;align-items:center;justify-content:space-between;gap:16px;
  margin-top:18px}
.puntos{display:flex;gap:0;flex-wrap:wrap;margin:0 -8px}
/* El punto se ve de 7 px, pero se toca en 24: el mínimo de la norma de
   accesibilidad. El círculo que se ve se dibuja con ::before, así que el
   área para el dedo crece sin que cambie el dibujo. */
.punto{position:relative;width:24px;height:24px;padding:0;background:none}
.punto::before{content:"";position:absolute;left:50%;top:50%;width:7px;height:7px;
  margin:-3.5px 0 0 -3.5px;border-radius:50%;background:var(--linea);
  transition:background .25s,transform .25s}
.punto.on::before{background:var(--morado);transform:scale(1.5)}
.cuenta{font-size:11px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--gris-claro);font-variant-numeric:tabular-nums}
.flechas{display:flex;gap:9px;flex:none}
.flecha{width:42px;height:42px;border:1px solid var(--linea);background:var(--tarjeta);
  color:var(--tinta);border-radius:50%;font-size:20px;line-height:1;
  display:grid;place-items:center;padding:0;box-shadow:var(--sombra);
  transition:background .2s,color .2s,opacity .2s}
.flecha:active{background:var(--morado);color:#fff;border-color:var(--morado)}
.flecha[disabled]{opacity:.3}



/* ---------- votación ---------- */
.votacion{padding:28px 24px}
.votacion h2{font-family:"Playfair Display",serif;font-weight:500;
  font-size:clamp(23px,5.6vw,31px);margin:0;line-height:1.16;letter-spacing:-.012em}
.votacion .txt{color:var(--gris);font-size:14.5px;margin:10px 0 0}
/* ---------- la votación ----------
   Tres cajas blancas iguales no dicen nada, y con cero votos ni siquiera
   traían barra: eran recuadros vacíos. Ahora el nombre va en la tipografía
   de los titulares, el riel se ve siempre —una votación en cero también es
   información— y la que va ganando queda marcada. */
.opcion{position:relative;display:block;width:100%;margin-top:11px;
  padding:17px 18px 15px;border:1px solid var(--linea);
  border-radius:var(--radio-chico);text-decoration:none;
  color:var(--tinta);overflow:hidden;background:var(--tarjeta);text-align:left;
  font:inherit;transition:border-color .25s,transform .2s,box-shadow .25s}
.opcion:active{transform:scale(.99)}
.opcion:hover{border-color:var(--morado-linea)}
/* el "gracias" después de votar: se queda arriba de la pista, en morado */
.voto-ok{margin:16px 0 0;padding:12px 14px;border-radius:var(--radio-chico);
  background:var(--morado-suave);border:1px solid var(--morado-linea);color:var(--morado-txt);
  font-size:14px;line-height:1.45}
.opcion.lider{border-color:var(--morado-linea);box-shadow:0 0 0 1px var(--realce)}
.opcion-fila{position:relative;display:flex;justify-content:space-between;
  align-items:flex-start;gap:16px}
.opcion-txt{font-family:"Playfair Display",serif;font-weight:500;font-size:19px;
  line-height:1.2;letter-spacing:-.01em}
.opcion-der{flex:none;text-align:right;line-height:1.15;margin-top:-3px}
.opcion-der b{display:block;font-family:"Playfair Display",serif;font-weight:500;
  font-size:24px;color:var(--morado-txt);font-variant-numeric:tabular-nums}
.opcion-der>span{display:block;margin-top:3px;font-size:10px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--gris-claro)}
.opcion-der .vota{display:inline-block;margin:2px 0 0;padding:6px 13px;border-radius:999px;
  background:var(--morado-suave);color:var(--morado-txt);font-size:10px;
  letter-spacing:.16em;text-transform:uppercase}
.opcion .riel{position:relative;display:block;height:3px;margin-top:13px;
  border-radius:999px;background:var(--linea-fina);overflow:hidden}
.opcion .riel i{display:block;height:100%;border-radius:999px;background:var(--morado);
  transition:width .6s cubic-bezier(.22,.8,.3,1)}
.opcion.lider .riel i{background:var(--morado-vivo)}
@media (prefers-reduced-motion: reduce){
  .opcion .riel i{transition:none}
}

/* ---------- lo que plantamos ---------- */
.siembra{display:grid;gap:24px;align-items:center}
@media(min-width:860px){.siembra{grid-template-columns:1fr 1.02fr;gap:44px}}
.siembra h2{font-family:"Playfair Display",serif;font-weight:500;
  font-size:clamp(27px,6.6vw,42px);line-height:1.06;margin:16px 0 0;letter-spacing:-.02em}
.siembra h2 em{font-style:italic;color:var(--morado-txt)}
.siembra .txt{color:var(--gris);font-size:15px;margin:16px 0 0;max-width:46ch}
.fotos-par{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.foto-card{position:relative;border-radius:var(--radio);overflow:hidden;aspect-ratio:3/4;
  background:var(--morado-suave);box-shadow:var(--sombra);isolation:isolate}
.foto-card .img{position:absolute;inset:0;background-size:cover;background-position:center;
  z-index:-2;transition:transform .7s cubic-bezier(.22,.8,.3,1)}
.foto-card:hover .img{transform:scale(1.05)}
.foto-card .velo-foto{position:absolute;inset:0;z-index:-1;pointer-events:none;
  background:linear-gradient(to top, rgba(10,5,26,.92) 0%, rgba(12,6,30,.62) 32%,
    rgba(12,6,30,.12) 62%, transparent 78%)}
.foto-card .rotulo{position:absolute;left:0;right:0;bottom:0;padding:16px 16px 18px;color:#fff}
.foto-card h3{font-family:"Playfair Display",serif;font-weight:500;font-size:21px;
  margin:0;line-height:1.14}
.foto-card p{font-size:12.5px;line-height:1.42;margin:6px 0 0;color:rgba(255,255,255,.84)}
@media (prefers-reduced-motion: reduce){.foto-card .img{transition:none}
  .foto-card:hover .img{transform:none}}

/* ---------- cierre ---------- */
.cierre{margin-top:56px}
/* En el cierre la foto es textura: manda el morado, que es lo nuestro. */
.cierre .velo-morado{
  background:
    var(--grano),
    linear-gradient(to bottom, rgba(38,13,92,.90) 0%, rgba(52,18,124,.84) 46%,
      rgba(76,28,172,.80) 100%),
    linear-gradient(to right, rgba(24,9,60,.55), rgba(24,9,60,0) 70%)}
:root[data-theme="dark"] .cierre .velo-morado,
:root:not([data-theme="light"]) .cierre .velo-morado{
  background:
    var(--grano),
    linear-gradient(to bottom, rgba(16,6,40,.93) 0%, rgba(26,10,64,.90) 46%,
      rgba(44,16,108,.86) 100%),
    linear-gradient(to right, rgba(10,4,26,.60), rgba(10,4,26,0) 70%)}
.cierre .foto-fondo{filter:saturate(.75) brightness(.95)}
@media(min-width:860px){
  .cierre .foto-fondo{filter:saturate(.75) brightness(.95) blur(3px)}
}
.cta{padding:52px 0 56px;text-align:center}
.cta h2{font-family:"Playfair Display",serif;font-weight:500;
  font-size:clamp(27px,7vw,44px);margin:16px 0 0;line-height:1.1;
  letter-spacing:-.018em;max-width:16ch;margin-inline:auto}
.cta .txt{color:var(--sobre-morado-tenue);font-size:15px;margin:14px auto 0;max-width:44ch}
.cta .pista{color:var(--sobre-morado-tenue)}
.acciones{display:grid;gap:10px;margin-top:28px;max-width:440px;margin-inline:auto}
@media(min-width:620px){.acciones{grid-template-columns:1fr 1fr;max-width:640px}}
.btn-wa{display:block;width:100%;text-decoration:none;text-align:center;border-radius:999px;
  padding:16px 16px;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;
  background:var(--sobre-morado);color:var(--morado-hondo);border:1px solid var(--sobre-morado);
  font-weight:500;transition:transform .2s}
.btn-wa:active{transform:scale(.98)}
.btn-wa.claro{background:transparent;color:var(--sobre-morado);border-color:var(--morado-filete)}
:root[data-theme="dark"] .btn-wa,:root:not([data-theme="light"]) .btn-wa{color:#1A0B3D}
:root[data-theme="dark"] .btn-wa.claro,:root:not([data-theme="light"]) .btn-wa.claro{color:var(--sobre-morado)}

/* ---------- de noche las fotos se sientan en la página ----------
   Una foto a todo brillo sobre un fondo casi negro deslumbra: la pupila se
   cierra con ella y el texto de alrededor se pierde. Es la práctica de
   cualquier interfaz oscura seria —bajarles un punto el brillo y el color—
   y de paso le quita el filo de recorte a los árboles. En claro no se toca
   nada: ahí el papel y la foto ya tienen el mismo brillo. */
:root[data-theme="dark"] .foto-card .img,
:root:not([data-theme="light"]) .foto-card .img,
:root[data-theme="dark"] .arbol .foto img,
:root:not([data-theme="light"]) .arbol .foto img,
:root[data-theme="dark"] .ficha-hero img,
:root:not([data-theme="light"]) .ficha-hero img,
:root[data-theme="dark"] .mini-foto,
:root:not([data-theme="light"]) .mini-foto{
  filter:brightness(.88) saturate(.93)}
:root[data-theme="dark"] .premio-arbol .capa,
:root:not([data-theme="light"]) .premio-arbol .capa{
  filter:brightness(.93) saturate(.95)}

.aviso-privacidad{margin:16px 0 0;font-size:12px;line-height:1.5;color:var(--gris-claro)}

/* ---------- pie ---------- */
footer{padding:30px 0 40px;text-align:center}
.pie-txt{font-size:13px;color:var(--gris);margin:0}
.pie-txt a{color:var(--gris);text-decoration:none;border-bottom:1px solid var(--linea)}
.pie-visitas{margin:8px 0 0;font-size:12px;color:var(--gris-claro);font-variant-numeric:tabular-nums}
.btn-admin{padding:10px;margin:10px auto 0;font-size:9.5px;color:var(--gris-claro);
  letter-spacing:.24em;text-transform:uppercase;display:block}

/* ---------- ventana (ficha, panel, formularios) ---------- */
.velo{position:fixed;inset:0;background:rgba(9,7,15,.62);display:flex;
  align-items:flex-end;justify-content:center;z-index:40;
  backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.hoja{background:var(--fondo);width:100%;max-width:620px;max-height:92vh;
  overflow-x:hidden;overflow-y:auto;overscroll-behavior:contain;
  border-radius:24px 24px 0 0;border-top:3px solid var(--morado);
  padding:24px var(--canal) calc(34px + env(safe-area-inset-bottom,0px))}
@media(min-width:680px){.velo{align-items:center;padding:24px}
  .hoja{border-radius:24px;max-height:88vh}}
.hoja-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;
  margin-bottom:20px}
.hoja-top h3{font-family:"Playfair Display",serif;font-weight:500;font-size:27px;
  margin:0;line-height:1.14;letter-spacing:-.014em}
.hoja-top .sub-t{font-size:12.5px;color:var(--gris);margin:6px 0 0}
.cerrar{border:1px solid var(--linea);border-radius:999px;width:36px;height:36px;
  font-size:17px;line-height:1;flex:none;color:var(--gris);background:var(--tarjeta)}
.ficha-hero{position:relative;border-radius:var(--radio-chico);overflow:hidden;
  background:var(--morado-suave);border:1px solid var(--borde)}
.ficha-hero img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.ficha-hero .vacia{aspect-ratio:4/3;display:grid;place-items:center;font-size:10px;
  letter-spacing:.2em;text-transform:uppercase;color:var(--gris-claro)}

.ficha-pie{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--gris-claro);margin:12px 2px 18px}
.ficha-dato{display:flex;justify-content:space-between;gap:18px;padding:13px 0;
  border-bottom:1px solid var(--linea-fina)}
.ficha-dato dt{font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--gris-claro);margin:0;padding-top:3px}
.ficha-dato dd{margin:0;font-size:15px;text-align:right}
.nota-ficha{font-size:14.5px;color:var(--gris);margin:18px 0 0;padding-left:15px;
  border-left:2px solid var(--morado-linea);line-height:1.55}
.acciones-ficha{display:flex;flex-wrap:wrap;gap:9px;margin-top:20px}
.enlace-mapa{display:inline-block;margin:0;font-size:10.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--morado);text-decoration:none;
  border:1px solid var(--morado-linea);border-radius:999px;padding:11px 17px}

/* ---------- controles ---------- */
.campo{margin:0 0 16px}
.campo label{display:block;font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--gris);margin-bottom:7px}
.campo input,.campo select,.campo textarea{width:100%;padding:13px;
  border:1px solid var(--linea);background:var(--campo);color:var(--tinta);
  font:inherit;font-size:16px;border-radius:12px}
.campo input:focus,.campo select:focus,.campo textarea:focus{outline:none;
  border-color:var(--morado);box-shadow:0 0 0 3px var(--morado-suave)}
.campo input[type=file]{padding:11px;font-size:13px;max-width:100%}
/* En iPhone el selector de archivo trae su propio ancho y empujaba la
   ventana de lado: se esconde y en su lugar va un botón nuestro. */
.campo .subir{position:relative;display:block;width:100%;padding:13px;
  border:1px dashed var(--linea);border-radius:12px;background:var(--tarjeta);
  color:var(--morado);font-size:12px;letter-spacing:.14em;text-transform:uppercase;
  text-align:center;cursor:pointer}
.campo .subir input[type=file]{position:absolute;inset:0;width:100%;height:100%;
  opacity:0;padding:0;border:0;cursor:pointer}
.campo .subir:focus-within{border-color:var(--morado);border-style:solid}
.hoja-pie{display:flex;gap:10px;margin-top:20px}
.hoja-pie .btn{flex:1;margin:0;display:flex;align-items:center;justify-content:center;
  text-decoration:none}
/* el mensaje que se va a mandar, tal cual va a llegar */
.mensaje-wa{border:1px solid var(--linea);border-left:3px solid var(--verde);
  border-radius:var(--radio-chico);background:var(--campo);padding:14px 16px;margin:0 0 14px}
.mensaje-wa p{margin:0;font-size:14px;line-height:1.55;white-space:pre-line;color:var(--tinta)}
/* lo que se pega del chat */
.pegado{width:100%;min-height:140px;padding:13px;border:1px solid var(--linea);
  border-radius:12px;background:var(--tarjeta);color:var(--tinta);font:inherit;
  font-size:13px;line-height:1.5;resize:vertical}
.hallazgo{display:flex;justify-content:space-between;gap:14px;padding:10px 0;
  border-bottom:1px solid var(--linea-fina);font-size:14px}
.hallazgo span:last-child{color:var(--gris);font-size:12.5px;text-align:right;flex:none}
.campo textarea{min-height:76px;resize:vertical;line-height:1.5}
.fila{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn{border:1px solid var(--morado);background:var(--morado);color:#fff;
  padding:15px 18px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;
  border-radius:999px;width:100%;font-weight:500;transition:transform .15s,opacity .2s}
.btn:active{transform:scale(.99)}
.btn.fantasma{background:none;color:var(--morado-txt)}
.btn.peligro{background:var(--rojo);border-color:var(--rojo);color:#fff}
.btn[disabled]{opacity:.45}
.aviso{font-size:14px;padding:15px 17px;border-radius:var(--radio-chico);
  background:var(--morado-suave);margin:0 0 18px;line-height:1.5}
.aviso.mal{background:rgba(192,57,43,.1)}
.aviso.sucio{border:1px solid var(--morado-linea)}
.aviso.sucio .btn{display:block}
.admin-grupo{border-top:1px solid var(--linea-fina);padding-top:20px;margin-top:24px}
.admin-item{display:flex;justify-content:space-between;align-items:center;gap:14px;
  padding:12px 0;border-bottom:1px solid var(--linea-fina);font-size:14px}
.admin-item button{color:var(--gris);font-size:9.5px;letter-spacing:.16em;
  text-transform:uppercase;min-height:36px;padding:0 8px}
.admin-item .tally{border:1px solid var(--linea);background:var(--tarjeta);
  color:var(--tinta);border-radius:999px;min-width:38px;height:36px;padding:0 12px;
  font-size:14px;letter-spacing:0;text-transform:none;margin-left:5px}
.admin-item .tally.mas{background:var(--morado);border-color:var(--morado);color:#fff}
.admin-item .tally.quita{border:0;background:none;color:#C0392B;min-width:24px;padding:0 4px}
.prev{width:100%;border-radius:12px;margin-top:9px}
.medidor{font-size:12px;color:var(--gris-claro);margin:0 0 12px;line-height:1.5}
.medidor.mal{color:var(--rojo)}
.plegado{border-top:1px solid var(--linea-fina);margin-top:16px}
.plegado>summary{list-style:none;cursor:pointer;padding:16px 0 14px;display:flex;
  justify-content:space-between;align-items:center;gap:12px;font-size:10px;
  letter-spacing:.26em;text-transform:uppercase;color:var(--morado);font-weight:500}
.plegado>summary::-webkit-details-marker{display:none}
.plegado>summary::after{content:'+';font-family:"Playfair Display",serif;font-size:21px;
  line-height:1;color:var(--gris-claro);letter-spacing:0}
.plegado[open]>summary::after{content:'−'}
.plegado .admin-grupo{border-top:0;padding-top:0;margin-top:0}
.plegado>div{padding-bottom:12px}

/* ---------- contador de lavados ---------- */
.contador{text-align:center;padding:22px 16px 6px}
.contador-n{font-family:"Playfair Display",serif;font-size:clamp(50px,17vw,68px);
  line-height:.92;color:var(--morado);font-variant-numeric:tabular-nums}
.contador-t{font-size:10px;letter-spacing:.24em;text-transform:uppercase;
  color:var(--gris);margin-top:10px}
.contador-hoy{font-size:13.5px;color:var(--gris);margin:14px 0 0}
.sumar{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}
.btn-sumar{background:var(--morado);color:#fff;border-radius:var(--radio-chico);
  padding:22px 8px;font-size:21px;font-family:"Playfair Display",serif;line-height:1;
  transition:transform .12s}
.btn-sumar:active{transform:scale(.96)}
.lectura{display:flex;justify-content:space-between;gap:12px;align-items:center;
  font-size:13px;color:var(--gris);margin:10px 0 0}
.lectura b{font-weight:500;color:var(--tinta);font-variant-numeric:tabular-nums}
.picker{margin-top:14px}
.picker .mapa-caja{border-radius:var(--radio-chico)}

/* ---------- cartel ---------- */
.cartel{background:#FFFFFF;color:#171225;border-radius:var(--radio-chico);
  padding:34px 28px 28px;text-align:center;border:1px solid rgba(23,18,37,.12)}
.cartel-mini{margin:16px 0}
.cartel-top{margin-bottom:16px}
.cartel-logo{width:66px;height:66px;object-fit:contain;margin:0 auto 12px;
  border-radius:50%;background:#6C2BD9;padding:7px}
.cartel .etq{color:#6C2BD9}
/* el cartel se imprime en papel blanco siempre, así que la marca va con
   colores fijos y no con los del tema */
.cartel>.sello{width:52px;height:52px;margin:0 auto 24px;
  stroke:rgba(108,43,217,.30)}
.cartel>.sello .on{stroke:#6C2BD9}
.cartel.mini>.sello{width:38px;height:38px;margin-bottom:18px}
/* max-width:none: la regla general de h1 (14ch, pensada para la portada)
   dejaba el título del cartel en un cuadro angosto pegado a la izquierda,
   con el texto centrado dentro de ese cuadro y no dentro del cartel */
.cartel-h1{max-width:none;font-family:"Playfair Display",serif;font-weight:600;
  font-size:clamp(25px,7vw,42px);line-height:1.04;margin:0 0 22px;color:#171225;
  letter-spacing:-.02em}
.cartel-h1 em{display:block;font-style:italic;font-weight:500;color:#6C2BD9}
.cartel-nota{margin:-12px auto 22px;max-width:28ch;font-size:13.5px;line-height:1.4;
  color:#514A64}
.cartel.mini .cartel-nota{font-size:12px;margin-bottom:16px}
.cartel-qr{width:min(62%,240px);margin:0 auto}
.cartel.mini .cartel-qr{width:min(48%,150px)}
.cartel-qr svg{width:100%;height:auto;display:block}
.cartel-pie{font-size:13.5px;color:#171225;margin:18px 0 0}
.cartel-datos{margin-top:20px;padding-top:15px;border-top:1px solid rgba(23,18,37,.12);
  font-size:11.5px;color:#6F6880}
.cartel-datos p{margin:2px 0}
#cartel-hoja{display:none}
body.imprimiendo #cartel-hoja{display:block;position:fixed;inset:0;z-index:90;
  background:#fff;padding:24px;overflow:auto}
@media print{
  /* mientras hay una ventana abierta el cuerpo va fijo y desplazado; si se
     imprime así, el cartel sale corrido fuera de la hoja */
  body.imprimiendo{position:static!important;top:auto!important;left:auto!important;
    right:auto!important;width:auto!important;overflow:visible!important}
  body.imprimiendo>*:not(#cartel-hoja){display:none!important}
  .asoma{opacity:1!important;transform:none!important}   /* en papel no asoma nada */
  body.imprimiendo #cartel-hoja{position:static;padding:0}
  .cartel{border:0;border-radius:0;padding:0}
  .cartel-h1{font-size:34pt}
  .cartel-qr{width:70mm}
  @page{margin:14mm}
}

/* ---------- entrada ---------- */
/* Cada pieza asoma al llegar a ella. Es poco movimiento a propósito: 16 px y
   medio segundo. Más que eso se siente lento cuando alguien viene bajando. */
.asoma{opacity:0;transform:translateY(16px);
  transition:opacity .6s ease, transform .6s cubic-bezier(.22,.8,.3,1)}
.asoma.visto{opacity:1;transform:none}
.carrusel .arbol.asoma{transform:translateY(16px) scale(.88)}
.carrusel .arbol.asoma.visto{transform:scale(.88)}
.carrusel .arbol.asoma.visto.act{transform:scale(1.02)}
@keyframes sube{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.entra{animation:sube .7s cubic-bezier(.22,.8,.3,1) both}
.entra-2{animation-delay:.08s}
.entra-3{animation-delay:.16s}
@media (prefers-reduced-motion: reduce){
  .entra,.entra-2,.entra-3{animation:none}
  .asoma{opacity:1;transform:none;transition:none}
  .carrusel{scroll-behavior:auto}
  .carrusel .arbol{transition:none}
  .carrusel .arbol:not(.act){transform:none;opacity:1}
  .carrusel .arbol.act{transform:none}
  .pin.sel .pin-pulso{animation:none}
  .riel i{transition:none}
}
